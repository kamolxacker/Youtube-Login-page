<!doctype html>
<html lang="uz">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./css/main.css" />
    <title>YouTube - Kirish</title>
    <link rel="icon" type="icon" href="./images/youtube.png">
  </head>
  <body>
    <div class="wrapper">
      <div class="yt-logo">
        <img src="./images/youtube.png" alt="loginForm" width="100" />
        <span>YouTube</span>
      </div>
      <div class="title-text">
        <div class="title login">Kirish</div>
        <div class="title signup">Ro'yxatdan o'tish</div>
      </div>
      <div class="form-container">
        <div class="slide-controls">
          <input type="radio" name="slide" id="login" checked />
          <input type="radio" name="slide" id="signup" />
          <label for="login" class="slide login">Kirish</label>
          <label for="signup" class="slide signup">Ro'yxatdan o'tish</label>
          <div class="slider-tab"></div>
        </div>
        <div class="form-inner">
          <form id="loginForm" action="#" class="login">
            <div class="field">
              <input type="text" placeholder="Email manzil" required />
            </div>
            <div class="field password-field">
                <input type="password" class="toggle-password" placeholder="Parol" required>
                <span class="toggle-eye">👁️</span>
            </div>
            <div class="pass-link"><a href="#">Parolni unutdingizmi?</a></div>
            <div class="field btn">
              <div class="btn-layer"></div>
              <input type="submit" value="Kirish" />
            </div>
            <div class="signup-link">
              Hisobingiz yo'qmi? <a href="">Ro'yxatdan o'ting</a>
            </div>
          </form>

          <form id="signupForm" action="#" class="signup">
            <div class="field">
              <input type="text" placeholder="Ism familya" required />
            </div>
            <div class="field">
              <input type="text" placeholder="Email manzil" required />
            </div>
            <div class="field password-field">
              <input type="password" placeholder="Parol" required />
              <span class="toggle-eye">👁️</span>
            </div>
            <div class="field password-field">
              <input type="password" placeholder="Parolni tasdiqlang" required/>
              <span class="toggle-eye">👁️</span>
            </div>
            <div class="field btn">
              <div class="btn-layer"></div>
              <input type="submit" value="Ro'yxatdan o'tish" />
            </div>
          </form>
        </div>
      </div>
    </div>

    <script src="./js/main.js"></script>
  </body>
</html>
